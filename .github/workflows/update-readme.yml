name: Update GitHub Activity and Language Statistics

on:
  schedule:
    - cron: "17 * * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "assets/top-langs.svg"

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Update GitHub Activity and Programming Languages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: fauzsanno
        run: |
          python - <<'PY'
          import os
          import json
          import html
          import urllib.request
          from pathlib import Path
          from datetime import datetime, timezone

          USERNAME = os.environ["GH_USERNAME"]
          TOKEN = os.environ["GITHUB_TOKEN"]

          API = "https://api.github.com"
          HEADERS = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {TOKEN}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "GitHub-Profile-Updater"
          }

          def github_get(url):
              request = urllib.request.Request(url, headers=HEADERS)

              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          # ==================================================
          # 1. UPDATE GITHUB ACTIVITY
          # ==================================================

          print("Fetching GitHub activity...")

          events = github_get(
              f"{API}/users/{USERNAME}/events/public?per_page=100"
          )

          def describe_event(event):
              event_type = event.get("type", "")
              repo = event.get("repo", {}).get("name", "")
              payload = event.get("payload", {})

              repo_name = f"[{repo}](https://github.com/{repo})"

              if event_type == "PushEvent":
                  commits = payload.get("commits", [])
                  count = payload.get("size", len(commits))
                  return f"Pushed {count} commit(s) to {repo_name}"

              if event_type == "CreateEvent":
                  ref_type = payload.get("ref_type", "repository")
                  return f"Created {ref_type} in {repo_name}"

              if event_type == "PullRequestEvent":
                  action = payload.get("action", "updated")
                  number = payload.get("number", "")
                  return f"{action.capitalize()} pull request #{number} in {repo_name}"

              if event_type == "IssuesEvent":
                  action = payload.get("action", "updated")
                  number = payload.get("issue", {}).get("number", "")
                  return f"{action.capitalize()} issue #{number} in {repo_name}"

              if event_type == "IssueCommentEvent":
                  return f"Commented on an issue in {repo_name}"

              if event_type == "WatchEvent":
                  return f"Starred {repo_name}"

              if event_type == "ForkEvent":
                  return f"Forked {repo_name}"

              if event_type == "ReleaseEvent":
                  return f"Published a release in {repo_name}"

              if event_type == "DeleteEvent":
                  ref_type = payload.get("ref_type", "reference")
                  return f"Deleted {ref_type} in {repo_name}"

              return None

          activity_lines = []

          for event in events:
              description = describe_event(event)

              if not description:
                  continue

              created_at = event.get("created_at", "")

              try:
                  date = datetime.fromisoformat(
                      created_at.replace("Z", "+00:00")
                  ).strftime("%Y-%m-%d")
              except (ValueError, TypeError):
                  date = "Recently"

              activity_lines.append(
                  f"- {description} — {date}"
              )

              if len(activity_lines) == 5:
                  break

          if not activity_lines:
              activity_lines = [
                  "- No recent public GitHub activity found."
              ]

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")

          start_marker = "<!--START_SECTION:activity-->"
          end_marker = "<!--END_SECTION:activity-->"

          if start_marker not in readme or end_marker not in readme:
              raise ValueError(
                  "Activity markers are missing from README.md"
              )

          start = readme.index(start_marker) + len(start_marker)
          end = readme.index(end_marker)

          readme = (
              readme[:start]
              + "\n"
              + "\n".join(activity_lines)
              + "\n"
              + readme[end:]
          )

          readme_path.write_text(readme, encoding="utf-8")

          print("GitHub Activity updated.")

          # ==================================================
          # 2. GET PUBLIC REPOSITORIES
          # ==================================================

          print("Fetching public repositories...")

          repositories = []
          page = 1

          while True:
              url = (
                  f"{API}/users/{USERNAME}/repos"
                  f"?type=owner&per_page=100&page={page}"
              )

              batch = github_get(url)

              if not batch:
                  break

              repositories.extend(batch)
              page += 1

          # ==================================================
          # 3. CALCULATE PROGRAMMING LANGUAGES
          # ==================================================

          print("Calculating programming languages...")

          language_totals = {}

          for repo in repositories:
              if repo.get("fork") or repo.get("archived"):
                  continue

              languages_url = repo.get("languages_url")

              if not languages_url:
                  continue

              language_data = github_get(languages_url)

              for language, size in language_data.items():
                  language_totals[language] = (
                      language_totals.get(language, 0) + size
                  )

          top_languages = sorted(
              language_totals.items(),
              key=lambda item: item[1],
              reverse=True
          )[:8]

          if not top_languages:
              raise ValueError(
                  "No programming language data found."
              )

          total_bytes = sum(size for _, size in top_languages)

          # ==================================================
          # 4. GENERATE SVG CARD
          # ==================================================

          print("Generating SVG card...")

          colors = [
              "#3572A5",
              "#f1e05a",
              "#563d7c",
              "#e34c26",
              "#3178c6",
              "#b07219",
              "#00ADD8",
              "#dea584"
          ]

          width = 495
          height = 230
          bar_width = 455

          svg_parts = [
              f'<svg xmlns="http://www.w3.org/2000/svg" '
              f'width="{width}" height="{height}" '
              f'viewBox="0 0 {width} {height}">',
              '<rect width="100%" height="100%" rx="8" fill="#1a1b27"/>',
              '<text x="20" y="30" fill="#70a5fd" '
              'font-size="16" font-weight="bold">'
              'Most Used Languages</text>'
          ]

          current_x = 20

          for index, (language, size) in enumerate(top_languages):
              percentage = size / total_bytes * 100
              segment_width = bar_width * size / total_bytes
              color = colors[index % len(colors)]

              svg_parts.append(
                  f'<rect x="{current_x:.2f}" y="48" '
                  f'width="{segment_width:.2f}" height="9" '
                  f'fill="{color}"/>'
              )

              current_x += segment_width

          for index, (language, size) in enumerate(top_languages):
              percentage = size / total_bytes * 100
              color = colors[index % len(colors)]
              y = 83 + index * 18

              svg_parts.append(
                  f'<circle cx="25" cy="{y - 4}" r="4" '
                  f'fill="{color}"/>'
              )

              svg_parts.append(
                  f'<text x="38" y="{y}" '
                  f'font-size="11" fill="#c9d1d9">'
                  f'{html.escape(language)}</text>'
              )

              svg_parts.append(
                  f'<text x="465" y="{y}" text-anchor="end" '
                  f'font-size="11" fill="#8b949e">'
                  f'{percentage:.1f}%</text>'
              )

          svg_parts.append("</svg>")

          output_dir = Path("assets")
          output_dir.mkdir(exist_ok=True)

          output_file = output_dir / "top-langs.svg"
          output_file.write_text(
              "\n".join(svg_parts),
              encoding="utf-8"
          )

          print(f"SVG generated: {output_file}")
          print("Top programming languages:")

          for language, size in top_languages:
              percentage = size / total_bytes * 100
              print(f"{language}: {percentage:.2f}%")

          PY

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md assets/top-langs.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update GitHub profile statistics"
            git push
          fi
